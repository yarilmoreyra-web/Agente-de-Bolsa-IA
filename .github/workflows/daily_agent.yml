name: Daily Pre-Market Trading Agent

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha opcional (YYYY-MM-DD). Si se vacía, usa la actual.'
        required: false
        type: string
      dry_run:
        description: 'Ejecutar en modo prueba (sin Telegram ni histórico)'
        required: false
        type: boolean
        default: false
      no_gemini:
        description: 'Desactivar análisis Gemini (solo Python)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Forzar ejecución (ignorar guarda horaria e idempotencia)'
        required: false
        type: boolean
        default: false

  # Dos crons para las 08:35 ET (considerando cambio horario UTC / verano e invierno):
  # - Verano (EDT, UTC-4): 08:35 ET = 12:35 UTC
  # - Invierno (EST, UTC-5): 08:35 ET = 13:35 UTC
  schedule:
    - cron: '35 12 * * 1-5'
    - cron: '35 13 * * 1-5'

concurrency:
  group: daily-trading-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trading Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.no_gemini }}" = "true" ]; then ARGS="$ARGS --no-gemini"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          
          python main.py $ARGS

      - name: Commit and push generated history and reports
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || echo "No rebase needed"
          git add data/ logs/
          git status
          git diff --staged --quiet || git commit -m "chore: update agent reports and history [skip ci]"
          git push || echo "No changes to push or push failed"

      - name: Upload logs artifact
        uses: actions/action-hub/upload-artifact@v4 # O standard actions/upload-artifact@v4
        if: always()
        with:
          name: agent-logs
          path: logs/