name: Actualización post-apertura

# Segunda pasada del día: a las 10:00 hora de Nueva York (ET), 30 minutos
# después de la apertura, el agente reanaliza las candidatas del informe de
# las 09:00, las compara con él y envía un nuevo Telegram.
#
# GitHub programa los cron en UTC y no entiende de horario de verano, así que
# hay DOS cron (verano EDT = UTC-4 e invierno EST = UTC-5). Los dos se lanzan
# siempre, pero solo uno cae a las ~09:45 ET; el otro se descarta solo (primero
# en el paso "Comprobar hora" y, como segunda red de seguridad, en la guarda
# horaria de main.py --update).
#
# El agente arranca a las ~09:45 ET y espera hasta las 10:00 para tomar los
# datos: el margen de 15 min absorbe el retraso habitual de los cron de GitHub
# (10-30 min). Si el retraso es tan grande que ya pasan las 10:30 ET, la
# ejecución se descarta: una actualización tan tardía dejaría de ser "a los 30
# minutos de la apertura". Se evita la hora en punto para no coincidir con el
# pico de carga de GitHub.
#
# Requisito: el informe de la mañana (workflow "Agente pre-market diario") ya
# guardó data/history/AAAA-MM-DD.json en el repositorio.
on:
  schedule:
    - cron: "45 13 * * 1-5"   # 09:45 ET en horario de verano (EDT = UTC-4)
    - cron: "45 14 * * 1-5"   # 09:45 ET en horario de invierno (EST = UTC-5)
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha de la sesión AAAA-MM-DD (vacío = hoy en Nueva York)"
        required: false
        default: ""
      dry_run:
        description: "Prueba: genera la actualización pero no envía a Telegram ni guarda nada"
        type: boolean
        default: false
      no_gemini:
        description: "No llamar a Gemini (solo análisis de Python)"
        type: boolean
        default: false
      force:
        description: "Ignorar calendario, ventana horaria y 'ya enviado' (para pruebas manuales)"
        type: boolean
        default: false

# Necesario para que el paso final pueda guardar el resultado con un commit.
permissions:
  contents: write

# Mismo grupo que el workflow de la mañana: nunca dos ejecuciones a la vez
# (evita mensajes duplicados y conflictos de git al subir data/).
concurrency:
  group: daily-agent
  cancel-in-progress: false

jobs:
  run-update:
    runs-on: ubuntu-latest
    # El agente espera hasta las 10:00 ET para tomar los datos: margen amplio.
    timeout-minutes: 35

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Filtro barato para las ejecuciones programadas: si no son ~09:45 ET
      # (cron del horario contrario) se sale sin instalar nada. La guarda
      # definitiva está en main.py. Las ejecuciones manuales nunca se filtran aquí.
      - name: Comprobar hora en Nueva York
        id: gate
        run: |
          now_hhmm=$((10#$(TZ=America/New_York date +%H%M)))
          echo "Hora actual en Nueva York (HHMM): $now_hhmm"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && { [ "$now_hhmm" -lt 935 ] || [ "$now_hhmm" -gt 1030 ]; }; then
            echo "Cron del horario contrario o demasiado tarde: se omite esta ejecución."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar la actualización
        if: steps.gate.outputs.run == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          # Secretos (Settings > Secrets and variables > Actions > Secrets)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          # El modelo va como VARIABLE (no secret): si no existe o está vacía,
          # el código usa el modelo por defecto de config.py.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Entradas del lanzamiento manual (vacías en las ejecuciones programadas).
          # Se pasan por variables de entorno, nunca pegadas dentro del script.
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_NO_GEMINI: ${{ inputs.no_gemini }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=(--update)
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$INPUT_NO_GEMINI" = "true" ]; then args+=(--no-gemini); fi
          if [ "$INPUT_FORCE" = "true" ]; then args+=(--force); fi
          echo "Ejecutando: python main.py ${args[*]}"
          python main.py "${args[@]}"

      # Los runners de Actions son efímeros: sin este paso el resultado se
      # perdería al terminar (y la marca de "ya enviado" con él). Se ejecuta
      # aunque el agente haya salido antes y no hace nada si no hay cambios.
      - name: Guardar el resultado en el repositorio
        if: always() && steps.gate.outputs.run == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en data/: nada que guardar."
            exit 0
          fi
          git commit -m "chore: actualización post-apertura $(date -u +%F) [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            echo "Intento $attempt fallido; reintento en 5 s..."
            sleep 5
          done
          echo "No se pudo guardar el resultado tras 3 intentos."
          exit 1

      - name: Subir el log como artefacto
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-log-update
          path: logs/agent.log
          if-no-files-found: ignore
          retention-days: 14
