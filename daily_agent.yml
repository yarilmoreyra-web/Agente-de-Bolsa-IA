name: Agente pre-market diario

# El informe se envía a las 09:00 hora de Nueva York (ET), 30 min antes de la
# apertura. GitHub programa los cron en UTC y no entiende de horario de
# verano, así que hay DOS cron: uno para verano (EDT, UTC-4) y otro para
# invierno (EST, UTC-5). Los dos se lanzan siempre, pero solo uno cae a las
# ~08:35 ET; el otro se descarta solo (primero en el paso "Comprobar hora" y,
# como segunda red de seguridad, en la guarda horaria de main.py).
#
# Nota: GitHub puede retrasar los cron 10-30 min o más, por eso se lanzan
# 25 minutos antes del snapshot pre-market (08:45 ET) y se evita la hora en punto.
on:
  schedule:
    - cron: "35 12 * * 1-5"   # 08:35 ET en horario de verano (EDT = UTC-4)
    - cron: "35 13 * * 1-5"   # 08:35 ET en horario de invierno (EST = UTC-5)
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha de la sesión AAAA-MM-DD (vacío = hoy en Nueva York)"
        required: false
        default: ""
      dry_run:
        description: "Prueba: genera el informe pero no envía a Telegram ni guarda histórico"
        type: boolean
        default: false
      no_gemini:
        description: "No llamar a Gemini (solo análisis de Python)"
        type: boolean
        default: false
      force:
        description: "Ignorar calendario, ventana horaria y 'ya enviado' (para pruebas manuales)"
        type: boolean
        default: false

# Necesario para que el paso final pueda guardar el histórico con un commit.
permissions:
  contents: write

# Nunca dos ejecuciones a la vez (evita informes duplicados y conflictos de git).
concurrency:
  group: daily-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    # El agente espera hasta las 08:45 ET para tomar el snapshot: margen amplio.
    timeout-minutes: 40

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Filtro barato para las ejecuciones programadas: si no son ~08:35 ET
      # (cron del horario contrario) se sale sin instalar nada. La guarda
      # definitiva está en main.py. Las ejecuciones manuales nunca se filtran aquí.
      - name: Comprobar hora en Nueva York
        id: gate
        run: |
          now_hhmm=$((10#$(TZ=America/New_York date +%H%M)))
          echo "Hora actual en Nueva York (HHMM): $now_hhmm"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && { [ "$now_hhmm" -lt 755 ] || [ "$now_hhmm" -gt 930 ]; }; then
            echo "Cron del horario contrario: se omite esta ejecución."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el agente
        if: steps.gate.outputs.run == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          # Secretos (Settings > Secrets and variables > Actions > Secrets)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          # El modelo va como VARIABLE (no secret): si no existe o está vacía,
          # el código usa el modelo por defecto de config.py.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Entradas del lanzamiento manual (vacías en las ejecuciones programadas).
          # Se pasan por variables de entorno, nunca pegadas dentro del script.
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_NO_GEMINI: ${{ inputs.no_gemini }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$INPUT_NO_GEMINI" = "true" ]; then args+=(--no-gemini); fi
          if [ "$INPUT_FORCE" = "true" ]; then args+=(--force); fi
          echo "Ejecutando: python main.py ${args[*]}"
          python main.py "${args[@]}"

      # Los runners de Actions son efímeros: sin este paso el histórico se
      # perdería al terminar. Se ejecuta aunque el agente haya salido antes
      # (día sin sesión, fuera de ventana) y no hace nada si no hay cambios.
      - name: Guardar el histórico en el repositorio
        if: always() && steps.gate.outputs.run == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en data/: nada que guardar."
            exit 0
          fi
          git commit -m "chore: histórico del agente $(date -u +%F) [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            echo "Intento $attempt fallido; reintento en 5 s..."
            sleep 5
          done
          echo "No se pudo guardar el histórico tras 3 intentos."
          exit 1

      - name: Subir el log como artefacto
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-log
          path: logs/agent.log
          if-no-files-found: ignore
          retention-days: 14
